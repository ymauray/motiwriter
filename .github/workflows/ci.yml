name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Réutilisé par release.yml avant de fabriquer les exécutables.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore

      - name: Compilation
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Tests
        run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultats-tests
          path: TestResults
          retention-days: 14

