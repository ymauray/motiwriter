name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore

      - name: Compilation
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Tests
        run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: TestResults
          retention-days: 14

  publish:
    name: Binaire autonome (${{ matrix.rid }})
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, osx-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publication
        run: dotnet publish src/MotiWriter.Web -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}

      # L'exécutable Linux x64 tourne sur le runner : on vérifie qu'il démarre et sert ses pages.
      - name: Essai de démarrage
        if: matrix.rid == 'linux-x64'
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/publish/linux-x64/MotiWriter.Web" --urls http://localhost:5199 \
            > motiwriter.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5199/connexion && break
            sleep 1
          done
          set -x
          curl -sf http://localhost:5199/connexion | grep -q "Bienvenue"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5199/)" = "302"
          css=$(curl -sf http://localhost:5199/connexion | grep -oE 'href="app\.[^"]*\.css"' | cut -d'"' -f2)
          curl -sf -o /dev/null "http://localhost:5199/$css"
          test -d "$GITHUB_WORKSPACE/publish/linux-x64/App_Data"
          kill $pid

      - name: Journal de l'essai
        if: failure() && matrix.rid == 'linux-x64'
        run: cat "${{ runner.temp }}/motiwriter.log"

      - uses: actions/upload-artifact@v4
        with:
          name: motiwriter-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}
            !publish/${{ matrix.rid }}/App_Data
          retention-days: 14
