name: Release

# Un tag vX.Y.Z (par ex. v1.2.0) fabrique les exécutables autonomes et les publie
# dans une release GitHub.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Binaire autonome (${{ matrix.rid }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, osx-x64, win-x64]
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publication
        run: dotnet publish src/MotiWriter.Web -c Release -r "$RID" -p:Version="$VERSION" -o "publish/$RID"

      # L'exécutable Linux x64 tourne sur le runner : on vérifie qu'il démarre et sert ses pages.
      - name: Essai de démarrage
        if: matrix.rid == 'linux-x64'
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/publish/linux-x64/MotiWriter.Web" --urls http://localhost:5199 \
            > motiwriter.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5199/connexion && break
            sleep 1
          done
          set -x
          curl -sf http://localhost:5199/connexion | grep -q "Bienvenue"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5199/)" = "302"
          css=$(curl -sf http://localhost:5199/connexion | grep -oE 'href="app\.[^"]*\.css"' | cut -d'"' -f2)
          curl -sf -o /dev/null "http://localhost:5199/$css"
          kill $pid
          rm -rf "$GITHUB_WORKSPACE/publish/linux-x64/App_Data"

      - name: Journal de l'essai
        if: failure() && matrix.rid == 'linux-x64'
        run: cat "${{ runner.temp }}/motiwriter.log"

      # Archive avec un dossier racine ; tar.gz conserve le droit d'exécution (Linux, macOS).
      - name: Archive
        run: |
          name="motiwriter-$VERSION-$RID"
          mkdir -p dist
          mv "publish/$RID" "publish/$name"
          cd publish
          if [[ "$RID" == win-* ]]; then
            zip -qr "../dist/$name.zip" "$name"
          else
            tar -czf "../dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.rid }}
          path: dist/*
          retention-days: 1

  release:
    name: Release GitHub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Sommes de contrôle
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "MotiWriter ${GITHUB_REF_NAME#v}" \
            --generate-notes
